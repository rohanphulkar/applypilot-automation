name: applypilot

services:
  # ----------------------------------------------------------------------------
  # 1. MongoDB Database
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7
    container_name: applypilot-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - applypilot-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Redis Task Store (BullMQ Broker)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: applypilot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - applypilot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 3. Resume Tailoring API (Python FastAPI + pdflatex + ATS Engine)
  # ----------------------------------------------------------------------------
  resume-api:
    build:
      context: ./resume-api
      dockerfile: Dockerfile
    container_name: applypilot-resume-api
    restart: unless-stopped
    command: ["uv", "run", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    environment:
      - HOST=0.0.0.0
      - PORT=8001
      - DEBUG=False
      - MONGODB_URI=mongodb://mongodb:27017/resume_generator_db
      - MONGODB_DB_NAME=resume_generator_db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-applypilot-platform}
      - S3_KEY_PREFIX=${S3_KEY_PREFIX:-resumes}
      - PRESIGNED_URL_EXPIRATION=${PRESIGNED_URL_EXPIRATION:-604800}
    volumes:
      - media-data:/app/media
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - applypilot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 4. Backend REST API Server (Node.js / Express)
  # ----------------------------------------------------------------------------
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: applypilot-backend-api
    restart: unless-stopped
    command: npm start
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/applypilot
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - RESUME_API_BASE_URL=http://resume-api:8001
      - RESUME_API_ENDPOINT=/api/resume/tailor
      - EMAIL_NAME=${EMAIL_NAME:-Rohan Phulkar}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - SMTP_HOST=${SMTP_HOST:-mail.spacemail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - IMAP_HOST=${IMAP_HOST:-mail.spacemail.com}
      - IMAP_PORT=${IMAP_PORT:-993}
      - IMAP_SECURE=${IMAP_SECURE:-true}
      - IMAP_ENABLED=${IMAP_ENABLED:-true}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      resume-api:
        condition: service_started
    networks:
      - applypilot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 5. BullMQ Background Worker (Node.js Pipeline Worker)
  # ----------------------------------------------------------------------------
  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: applypilot-backend-worker
    restart: unless-stopped
    command: npm run worker
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/applypilot
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-3}
      - WORKER_ATTEMPTS=${WORKER_ATTEMPTS:-3}
      - WORKER_BACKOFF_DELAY=${WORKER_BACKOFF_DELAY:-5000}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - RESUME_API_BASE_URL=http://resume-api:8001
      - RESUME_API_ENDPOINT=/api/resume/tailor
      - EMAIL_NAME=${EMAIL_NAME:-Rohan Phulkar}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - SMTP_HOST=${SMTP_HOST:-mail.spacemail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - IMAP_HOST=${IMAP_HOST:-mail.spacemail.com}
      - IMAP_PORT=${IMAP_PORT:-993}
      - IMAP_SECURE=${IMAP_SECURE:-true}
      - IMAP_ENABLED=${IMAP_ENABLED:-true}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      resume-api:
        condition: service_started
    networks:
      - applypilot-network

  # ----------------------------------------------------------------------------
  # 6. Frontend Dashboard & Nginx Gateway (React SPA + Nginx Reverse Proxy + SSL)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: applypilot-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "3000:80"
    environment:
      - DOMAIN=${DOMAIN:-jobs.rohanphulkar.com}
      - VITE_API_BASE_URL=
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - backend-api
    networks:
      - applypilot-network

  # ----------------------------------------------------------------------------
  # 7. Let's Encrypt Certbot (Automatic SSL Renewal)
  # ----------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: applypilot-certbot
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - frontend
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - applypilot-network

# ------------------------------------------------------------------------------
# Networks & Persistent Volumes
# ------------------------------------------------------------------------------
networks:
  applypilot-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
  redis-data:
    driver: local
  media-data:
    driver: local
  certbot-etc:
    driver: local
  certbot-var:
    driver: local
  certbot-www:
    driver: local
