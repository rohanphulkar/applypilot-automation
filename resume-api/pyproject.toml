[project]
name = "resume-api"
version = "0.1.0"
description = "Resume Generator API - High-performance microservice for ATS 92+ OpenAI resume tailoring, LaTeX/PDF/DOCX generation, MongoDB persistence, and AWS S3 presigned URLs"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Rohan Phulkar", email = "hello@rohanphulkar.com" }
]
dependencies = [
    "boto3>=1.43.72",
    "fastapi>=0.141.1",
    "lxml>=6.1.1",
    "motor>=3.7.1",
    "openai>=3.1.0",
    "pymongo>=4.17.0",
    "pypdf>=6.16.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "reportlab>=5.0.1",
    "uuid>=1.30",
    "uvicorn>=0.52.4",
]

[project.scripts]
resume-generator = "main:start"
resume-api = "main:start"

[project.urls]
Homepage = "https://rohanphulkar.com"
Repository = "https://github.com/rohanphulkar/applypilot"
LinkedIn = "https://linkedin.com/in/rohanphulkar"
